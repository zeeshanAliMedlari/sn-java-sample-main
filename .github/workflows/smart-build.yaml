name: OSGi Smart Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

      base_sha:
        description: "Optional base SHA for changed-mode comparison"
        required: false
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  smart-build:
    name: OSGi Smart Build
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. JAVA
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # ------------------------------------------------------------
      # 3. DISCOVER OSGi COMPONENTS
      # ------------------------------------------------------------
      - name: Discover OSGi components
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DISCOVERING OSGi COMPONENTS"
          echo "============================================================"

          COMPONENTS=()

          for dir in */; do
            dir="${dir%/}"

            if [[ -f "$dir/pom.xml" ]]; then
              if grep -Eq '<packaging>eclipse-plugin</packaging>|<packaging>eclipse-feature</packaging>|<artifactId>.*</artifactId>' "$dir/pom.xml"; then
                COMPONENTS+=("$dir")
              fi
            fi
          done

          # Explicitly keep only the product modules used by the workshop.
          COMPONENTS=(
            catalog
            customer
            security
            payment
            shipping
            notification
            orders
            reporting
            thirdparty
          )

          echo "Discovered components:"
          for component in "${COMPONENTS[@]}"; do
            echo "  - $component"
          done

          printf '%s\n' "${COMPONENTS[@]}" > components.txt

          {
            echo "components<<EOF"
            printf '%s\n' "${COMPONENTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 4. BUILD OSGi DEPENDENCY GRAPH
      # ------------------------------------------------------------
      - name: Build OSGi dependency graph
        id: graph
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING OSGi DEPENDENCY GRAPH"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          declare -A SYMBOLIC_NAME
          declare -A EXPORT_PACKAGES
          declare -A COMPONENT_FEATURE

          declare -A DEPENDENCIES
          declare -A DEPENDENTS

          # --------------------------------------------------------
          # Discover bundle metadata
          # --------------------------------------------------------
          for component in "${COMPONENTS[@]}"; do

            pom="$component/pom.xml"

            if [[ ! -f "$pom" ]]; then
              echo "WARNING: Missing $pom"
              continue
            fi

            symbolic_name=""

            if [[ -f "$component/META-INF/MANIFEST.MF" ]]; then
              symbolic_name=$(
                awk -F': ' '
                  /^Bundle-SymbolicName:/ {
                    print $2
                    exit
                  }
                ' "$component/META-INF/MANIFEST.MF" |
                sed 's/;.*//'
              )
            fi

            if [[ -z "$symbolic_name" ]]; then
              symbolic_name="$component"
            fi

            SYMBOLIC_NAME["$component"]="$symbolic_name"

            echo "Component: $component"
            echo "  Bundle-SymbolicName: $symbolic_name"

            # ------------------------------------------------------
            # Exported packages
            # ------------------------------------------------------
            exports=""

            if [[ -f "$component/META-INF/MANIFEST.MF" ]]; then
              exports=$(
                awk '
                  /^Export-Package:/ {
                    flag=1
                    sub(/^Export-Package:[[:space:]]*/, "")
                    printf "%s", $0
                    next
                  }

                  flag && /^[^[:space:]]/ {
                    flag=0
                  }

                  flag {
                    gsub(/^[[:space:]]+/, "")
                    printf "%s", $0
                  }

                  END {
                    print ""
                  }
                ' "$component/META-INF/MANIFEST.MF"
              )
            fi

            EXPORT_PACKAGES["$component"]="$exports"

            # ------------------------------------------------------
            # Feature ID
            # ------------------------------------------------------
            feature_id=""

            if [[ -f "$component/feature.xml" ]]; then
              feature_id=$(
                sed -n 's/.*id="\([^"]*\)".*/\1/p' \
                  "$component/feature.xml" |
                head -1
              )
            fi

            COMPONENT_FEATURE["$component"]="$feature_id"
          done

          # --------------------------------------------------------
          # Helper: add dependency
          #
          # Direction:
          #
          # dependency -> dependent
          #
          # Example:
          #
          # catalog -> orders
          #
          # means orders depends on catalog.
          # --------------------------------------------------------
          add_edge() {
            local dependency="$1"
            local dependent="$2"

            [[ "$dependency" == "$dependent" ]] && return

            DEPENDENTS["$dependency"]="${DEPENDENTS[$dependency]:-} $dependent"
            DEPENDENCIES["$dependent"]="${DEPENDENCIES[$dependent]:-} $dependency"
          }

          # --------------------------------------------------------
          # Require-Bundle
          # --------------------------------------------------------
          echo ""
          echo "Analyzing Require-Bundle dependencies..."

          for dependent in "${COMPONENTS[@]}"; do

            manifest="$dependent/META-INF/MANIFEST.MF"

            [[ -f "$manifest" ]] || continue

            require_bundle=$(
              awk '
                /^Require-Bundle:/ {
                  flag=1
                  sub(/^Require-Bundle:[[:space:]]*/, "")
                  printf "%s", $0
                  next
                }

                flag && /^[^[:space:]]/ {
                  flag=0
                }

                flag {
                  gsub(/^[[:space:]]+/, "")
                  printf "%s", $0
                }

                END {
                  print ""
                }
              ' "$manifest"
            )

            IFS=',' read -ra bundles <<< "$require_bundle"

            for bundle in "${bundles[@]}"; do

              bundle=$(echo "$bundle" | sed 's/;.*//' | xargs)

              [[ -z "$bundle" ]] && continue

              for dependency in "${COMPONENTS[@]}"; do

                if [[ "${SYMBOLIC_NAME[$dependency]:-}" == "$bundle" ]]; then
                  add_edge "$dependency" "$dependent"

                  echo "  $dependency -> $dependent"
                fi

              done
            done
          done

          # --------------------------------------------------------
          # Import-Package -> Export-Package
          # --------------------------------------------------------
          echo ""
          echo "Analyzing Import-Package / Export-Package dependencies..."

          for dependent in "${COMPONENTS[@]}"; do

            manifest="$dependent/META-INF/MANIFEST.MF"

            [[ -f "$manifest" ]] || continue

            imports=$(
              awk '
                /^Import-Package:/ {
                  flag=1
                  sub(/^Import-Package:[[:space:]]*/, "")
                  printf "%s", $0
                  next
                }

                flag && /^[^[:space:]]/ {
                  flag=0
                }

                flag {
                  gsub(/^[[:space:]]+/, "")
                  printf "%s", $0
                }

                END {
                  print ""
                }
              ' "$manifest"
            )

            IFS=',' read -ra packages <<< "$imports"

            for package in "${packages[@]}"; do

              package=$(echo "$package" | sed 's/;.*//' | xargs)

              [[ -z "$package" ]] && continue

              for dependency in "${COMPONENTS[@]}"; do

                exports="${EXPORT_PACKAGES[$dependency]:-}"

                if echo ",$exports," | grep -Fq ",$package,"; then
                  add_edge "$dependency" "$dependent"

                  echo "  $dependency -> $dependent"
                fi

              done
            done
          done

          # --------------------------------------------------------
          # Feature dependencies
          # --------------------------------------------------------
          echo ""
          echo "Analyzing feature dependencies..."

          for dependent in "${COMPONENTS[@]}"; do

            feature_xml="$dependent/feature.xml"

            [[ -f "$feature_xml" ]] || continue

            while read -r feature_ref; do

              [[ -z "$feature_ref" ]] && continue

              for dependency in "${COMPONENTS[@]}"; do

                if [[ "${COMPONENT_FEATURE[$dependency]:-}" == "$feature_ref" ]]; then
                  add_edge "$dependency" "$dependent"

                  echo "  $dependency -> $dependent"
                fi

              done

            done < <(
              sed -n 's/.*feature="\([^"]*\)".*/\1/p' "$feature_xml"
            )
          done

          # --------------------------------------------------------
          # Remove duplicate edges
          # --------------------------------------------------------
          for component in "${COMPONENTS[@]}"; do

            DEPENDENCIES["$component"]=$(
              echo "${DEPENDENCIES[$component]:-}" |
              tr ' ' '\n' |
              awk 'NF && !seen[$0]++' |
              tr '\n' ' '
            )

            DEPENDENTS["$component"]=$(
              echo "${DEPENDENTS[$component]:-}" |
              tr ' ' '\n' |
              awk 'NF && !seen[$0]++' |
              tr '\n' ' '
            )

          done

          # --------------------------------------------------------
          # Print graph
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo "OSGi DEPENDENCY GRAPH"
          echo "============================================================"

          for component in "${COMPONENTS[@]}"; do

            for dependent in ${DEPENDENTS[$component]:-}; do
              echo "  $component -> $dependent"
            done

          done

          # --------------------------------------------------------
          # Generate Markdown graph
          # --------------------------------------------------------
          {
            echo "# OSGi Dependency Graph"
            echo ""
            echo "Dependency direction:"
            echo ""
            echo "\`dependency -> dependent\`"
            echo ""
            echo "If \`A -> B\`, then B depends on A."
            echo ""
            echo "## Dependency Graph"
            echo ""

            for component in "${COMPONENTS[@]}"; do

              for dependent in ${DEPENDENTS[$component]:-}; do
                echo "- \`$component\` → \`$dependent\`"
              done

            done

          } > osgi-dependency-graph.md

          # --------------------------------------------------------
          # Persist graph information
          # --------------------------------------------------------
          : > dependency-edges.txt

          for component in "${COMPONENTS[@]}"; do

            for dependent in ${DEPENDENTS[$component]:-}; do
              echo "$component|$dependent" >> dependency-edges.txt
            done

          done

      # ------------------------------------------------------------
      # 5. DETECT CHANGED COMPONENTS
      # ------------------------------------------------------------
      - name: Detect changed components
        id: changes
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DETECTING CHANGED OSGi COMPONENTS"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          MODE="${INPUT_MODE:-changed}"

          # --------------------------------------------------------
          # Determine base SHA
          # --------------------------------------------------------
          if [[ -n "${INPUT_BASE_SHA:-}" ]]; then

            BASE_SHA="$INPUT_BASE_SHA"

          elif [[ "$EVENT_NAME" == "pull_request" ]]; then

            BASE_SHA="${{ github.event.pull_request.base.sha }}"

          elif [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then

            BASE_SHA="$BEFORE_SHA"

          else

            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"

          fi

          HEAD_SHA="${GITHUB_SHA}"

          echo "Mode     : $MODE"
          echo "Base SHA : $BASE_SHA"
          echo "Head SHA : $HEAD_SHA"
          echo ""

          declare -A CHANGED

          # --------------------------------------------------------
          # Full build
          # --------------------------------------------------------
          if [[ "$MODE" == "all" ]]; then

            echo "Build mode is ALL."
            echo "All OSGi components will be selected."

            for component in "${COMPONENTS[@]}"; do
              CHANGED["$component"]=1
            done

          else

            if [[ -z "$BASE_SHA" ]]; then

              echo "WARNING: Could not determine BASE_SHA."
              echo "Falling back to full build."

              for component in "${COMPONENTS[@]}"; do
                CHANGED["$component"]=1
              done

            else

              echo "Changed files:"
              echo ""

              mapfile -t CHANGED_FILES < <(
                git diff --name-only "$BASE_SHA" "$HEAD_SHA"
              )

              if [[ ${#CHANGED_FILES[@]} -eq 0 ]]; then

                echo "No files changed."

              else

                for file in "${CHANGED_FILES[@]}"; do
                  echo "  $file"
                done

              fi

              echo ""

              # ----------------------------------------------------
              # Map changed files to components
              # ----------------------------------------------------
              for relative in "${CHANGED_FILES[@]}"; do

                matched=false

                for component in "${COMPONENTS[@]}"; do

                  if [[ "$relative" == "$component"/* ]]; then

                    CHANGED["$component"]=1
                    matched=true

                    echo "[CHANGED] $component"
                  fi

                done

                # --------------------------------------------------
                # Root Maven POM changes affect the whole reactor.
                # --------------------------------------------------
                case "$relative" in

                  pom.xml)

                    echo ""
                    echo "Root pom.xml changed."
                    echo "Selecting all OSGi components."

                    for component in "${COMPONENTS[@]}"; do
                      CHANGED["$component"]=1
                    done

                    ;;

                  .mvn/*)

                    echo ""
                    echo ".mvn configuration changed."
                    echo "Selecting all OSGi components."

                    for component in "${COMPONENTS[@]}"; do
                      CHANGED["$component"]=1
                    done

                    ;;

                  .github/workflows/*)

                    # IMPORTANT:
                    #
                    # Workflow changes do NOT automatically mean that
                    # every OSGi product changed.
                    #
                    # This prevents a workflow-only commit from causing
                    # a full product rebuild.
                    echo ""
                    echo "Workflow file changed."
                    echo "NOT selecting OSGi components because of workflow change alone."

                    ;;

                esac

              done

            fi

          fi

          echo ""
          echo "============================================================"
          echo "DIRECTLY CHANGED OSGi COMPONENTS"
          echo "============================================================"

          : > changed-components.txt

          DIRECT_COUNT=0

          for component in "${COMPONENTS[@]}"; do

            if [[ "${CHANGED[$component]:-0}" == "1" ]]; then

              echo "  [CHANGED] $component"
              echo "$component" >> changed-components.txt

              DIRECT_COUNT=$((DIRECT_COUNT + 1))

            fi

          done

          if [[ "$DIRECT_COUNT" -eq 0 ]]; then

            echo "  None"

          fi

          echo ""

          {
            echo "changed_count=$DIRECT_COUNT"
            echo "base_sha=$BASE_SHA"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 6. CALCULATE DEPENDENCY-AWARE REBUILD SET
      # ------------------------------------------------------------
      - name: Calculate rebuild set
        id: selection
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CALCULATING DEPENDENCY-AWARE REBUILD SET"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          declare -A CHANGED
          declare -A SELECTED
          declare -A DEPENDENTS

          # --------------------------------------------------------
          # Read directly changed components
          # --------------------------------------------------------
          if [[ -f changed-components.txt ]]; then

            while read -r component; do

              [[ -z "$component" ]] && continue

              CHANGED["$component"]=1
              SELECTED["$component"]=1

            done < changed-components.txt

          fi

          # --------------------------------------------------------
          # Read graph
          # --------------------------------------------------------
          while IFS='|' read -r dependency dependent; do

            [[ -z "$dependency" ]] && continue
            [[ -z "$dependent" ]] && continue

            DEPENDENTS["$dependency"]="${DEPENDENTS[$dependency]:-} $dependent"

          done < dependency-edges.txt

          # --------------------------------------------------------
          # If no components directly changed, nothing to rebuild.
          # --------------------------------------------------------
          if [[ ${#CHANGED[@]} -eq 0 ]]; then

            echo "No OSGi components changed."
            echo "Nothing needs to be rebuilt."

          else

            echo "Directly changed components:"
            for component in "${COMPONENTS[@]}"; do

              if [[ "${CHANGED[$component]:-0}" == "1" ]]; then
                echo "  - $component"
              fi

            done

            # ------------------------------------------------------
            # Traverse dependents transitively.
            #
            # Example:
            #
            # catalog -> orders -> reporting
            #
            # If catalog changes:
            #
            # catalog
            # orders
            # reporting
            # ------------------------------------------------------
            queue=()

            for component in "${COMPONENTS[@]}"; do

              if [[ "${CHANGED[$component]:-0}" == "1" ]]; then
                queue+=("$component")
              fi

            done

            index=0

            while [[ "$index" -lt "${#queue[@]}" ]]; do

              current="${queue[$index]}"
              index=$((index + 1))

              for dependent in ${DEPENDENTS[$current]:-}; do

                if [[ "${SELECTED[$dependent]:-0}" != "1" ]]; then

                  SELECTED["$dependent"]=1
                  queue+=("$dependent")

                  echo "  Dependency impact: $current -> $dependent"

                fi

              done

            done

          fi

          echo ""
          echo "============================================================"
          echo "FINAL REBUILD SET"
          echo "============================================================"

          : > selected-components.txt

          SELECTED_COUNT=0

          for component in "${COMPONENTS[@]}"; do

            if [[ "${SELECTED[$component]:-0}" == "1" ]]; then

              if [[ "${CHANGED[$component]:-0}" == "1" ]]; then
                echo "  [CHANGED] $component"
              else
                echo "  [DEPENDENCY] $component"
              fi

              echo "$component" >> selected-components.txt

              SELECTED_COUNT=$((SELECTED_COUNT + 1))

            fi

          done

          if [[ "$SELECTED_COUNT" -eq 0 ]]; then
            echo "  None"
          fi

          echo ""
          echo "Total selected: $SELECTED_COUNT"

          echo "selected_count=$SELECTED_COUNT" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 7. CALCULATE BUILD ORDER
      # ------------------------------------------------------------
      - name: Calculate OSGi build order
        id: order
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CALCULATING OSGi BUILD ORDER"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          declare -A SELECTED
          declare -A IN_DEGREE
          declare -A DEPENDENTS

          # --------------------------------------------------------
          # Read selected components
          # --------------------------------------------------------
          while read -r component; do

            [[ -z "$component" ]] && continue

            SELECTED["$component"]=1
            IN_DEGREE["$component"]=0

          done < selected-components.txt

          # --------------------------------------------------------
          # Read dependency graph
          # --------------------------------------------------------
          while IFS='|' read -r dependency dependent; do

            [[ -z "$dependency" ]] && continue
            [[ -z "$dependent" ]] && continue

            DEPENDENTS["$dependency"]="${DEPENDENTS[$dependency]:-} $dependent"

            # Only count edges where both nodes are selected.
            if [[ "${SELECTED[$dependency]:-0}" == "1" &&
                  "${SELECTED[$dependent]:-0}" == "1" ]]; then

              IN_DEGREE["$dependent"]=$(( ${IN_DEGREE[$dependent]:-0} + 1 ))

            fi

          done < dependency-edges.txt

          # --------------------------------------------------------
          # Kahn topological sort
          # --------------------------------------------------------
          queue=()

          for component in "${COMPONENTS[@]}"; do

            if [[ "${SELECTED[$component]:-0}" == "1" &&
                  "${IN_DEGREE[$component]:-0}" -eq 0 ]]; then

              queue+=("$component")

            fi

          done

          BUILD_ORDER=()

          while [[ "${#queue[@]}" -gt 0 ]]; do

            current="${queue[0]}"
            queue=("${queue[@]:1}")

            BUILD_ORDER+=("$current")

            for dependent in ${DEPENDENTS[$current]:-}; do

              if [[ "${SELECTED[$dependent]:-0}" == "1" ]]; then

                IN_DEGREE["$dependent"]=$(( ${IN_DEGREE[$dependent]:-0} - 1 ))

                if [[ "${IN_DEGREE[$dependent]}" -eq 0 ]]; then
                  queue+=("$dependent")
                fi

              fi

            done

          done

          # --------------------------------------------------------
          # Validate
          # --------------------------------------------------------
          SELECTED_COUNT=0

          for component in "${COMPONENTS[@]}"; do

            if [[ "${SELECTED[$component]:-0}" == "1" ]]; then
              SELECTED_COUNT=$((SELECTED_COUNT + 1))
            fi

          done

          if [[ "${#BUILD_ORDER[@]}" -ne "$SELECTED_COUNT" ]]; then

            echo ""
            echo "ERROR: Dependency graph contains a cycle or unresolved dependency."
            echo ""
            echo "Selected components: $SELECTED_COUNT"
            echo "Sorted components : ${#BUILD_ORDER[@]}"
            echo ""

            exit 1

          fi

          # --------------------------------------------------------
          # Display order
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo "FINAL OSGi BUILD ORDER"
          echo "============================================================"

          : > build-order.txt

          POSITION=1

          for component in "${BUILD_ORDER[@]}"; do

            echo "$POSITION. $component"
            echo "$component" >> build-order.txt

            POSITION=$((POSITION + 1))

          done

          if [[ "$POSITION" -eq 1 ]]; then
            echo "No components require rebuilding."
          fi

      # ------------------------------------------------------------
      # 8. GENERATE DEPENDENCY PATH REPORT
      # ------------------------------------------------------------
      - name: Generate dependency reports
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GENERATING DEPENDENCY REPORTS"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          declare -A DEPENDENTS

          while IFS='|' read -r dependency dependent; do

            [[ -z "$dependency" ]] && continue
            [[ -z "$dependent" ]] && continue

            DEPENDENTS["$dependency"]="${DEPENDENTS[$dependency]:-} $dependent"

          done < dependency-edges.txt

          {
            echo "# OSGi Dependency Paths"
            echo ""
            echo "## Changed Components"
            echo ""

            if [[ ! -s changed-components.txt ]]; then

              echo "No OSGi components changed."

            else

              while read -r changed; do

                [[ -z "$changed" ]] && continue

                echo "### $changed"
                echo ""

                echo "**Direct dependency impact:**"

                for dependent in ${DEPENDENTS[$changed]:-}; do
                  echo "- \`$changed\` → \`$dependent\`"
                done

                echo ""

              done < changed-components.txt

            fi

            echo ""
            echo "## Selected Rebuild Modules"
            echo ""

            if [[ -s selected-components.txt ]]; then

              while read -r component; do
                echo "- \`$component\`"
              done < selected-components.txt

            else

              echo "None"

            fi

          } > osgi-dependency-paths.md

          # --------------------------------------------------------
          # Build report
          # --------------------------------------------------------
          {
            echo "# OSGi Smart Build Report"
            echo ""
            echo "## Build Information"
            echo ""
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`${GITHUB_RUN_ID}\`"
            echo ""
            echo "## Changed Components"
            echo ""

            if [[ -s changed-components.txt ]]; then

              while read -r component; do
                echo "- \`$component\`"
              done < changed-components.txt

            else

              echo "None"

            fi

            echo ""
            echo "## Selected Rebuild Components"
            echo ""

            if [[ -s selected-components.txt ]]; then

              while read -r component; do
                echo "- \`$component\`"
              done < selected-components.txt

            else

              echo "None"

            fi

            echo ""
            echo "## Build Order"
            echo ""

            if [[ -s build-order.txt ]]; then

              position=1

              while read -r component; do
                echo "$position. \`$component\`"
                position=$((position + 1))
              done < build-order.txt

            else

              echo "No components rebuilt."

            fi

          } > osgi-smart-build-report.md

      # ------------------------------------------------------------
      # 9. GITHUB SUMMARY
      # ------------------------------------------------------------
      - name: Publish build summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# OSGi Smart Build"
            echo ""

            echo "## Changed Components"
            echo ""

            if [[ -s changed-components.txt ]]; then

              while read -r component; do
                echo "- **$component**"
              done < changed-components.txt

            else

              echo "- None"

            fi

            echo ""
            echo "## Selected Rebuild Components"
            echo ""

            if [[ -s selected-components.txt ]]; then

              while read -r component; do
                echo "- **$component**"
              done < selected-components.txt

            else

              echo "- None"

            fi

            echo ""
            echo "## Build Order"
            echo ""

            if [[ -s build-order.txt ]]; then

              position=1

              while read -r component; do

                echo "$position. **$component**"
                position=$((position + 1))

              done < build-order.txt

            else

              echo "No components rebuilt."

            fi

            echo ""
            echo "## Dependency Graph"
            echo ""
            cat osgi-dependency-graph.md

          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------
      # 10. BUILD SELECTED COMPONENTS
      # ------------------------------------------------------------
      - name: Build selected OSGi components
        if: ${{ hashFiles('selected-components.txt') != '' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING SELECTED OSGi COMPONENTS"
          echo "============================================================"

          if [[ ! -s selected-components.txt ]]; then

            echo "No components selected."
            echo "Nothing to build."
            exit 0

          fi

          POSITION=1

          while read -r component; do

            [[ -z "$component" ]] && continue

            echo ""
            echo "============================================================"
            echo "BUILD [$POSITION] : $component"
            echo "============================================================"

            if [[ ! -f "$component/pom.xml" ]]; then

              echo "ERROR: $component/pom.xml not found."
              exit 1

            fi

            mvn \
              -B \
              -ntp \
              -f "$component/pom.xml" \
              clean install \
              -DskipTests \
              -Dtycho.localArtifacts=default

            POSITION=$((POSITION + 1))

          done < build-order.txt

          echo ""
          echo "============================================================"
          echo "OSGi SMART BUILD COMPLETED"
          echo "============================================================"

      # ------------------------------------------------------------
      # 11. UPLOAD BUILD REPORT
      # ------------------------------------------------------------
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: northwind-osgi-build-report
          path: |
            changed-components.txt
            selected-components.txt
            build-order.txt
            dependency-edges.txt
            osgi-dependency-graph.md
            osgi-dependency-paths.md
            osgi-smart-build-report.md
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 12. UPLOAD MAVEN/TYCHO ARTIFACTS
      # ------------------------------------------------------------
      - name: Upload OSGi artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: northwind-osgi-artifacts
          path: |
            **/target/*.jar
            **/target/*.zip
            **/target/*.xml
          if-no-files-found: warn