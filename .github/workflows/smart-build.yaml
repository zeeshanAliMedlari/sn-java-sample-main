name: OSGi Smart Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

      base_sha:
        description: "Optional base SHA for changed-mode comparison"
        required: false
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:

  smart-build:

    name: OSGi Smart Build

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # ============================================================
      # 3. DISCOVER COMPONENTS
      # ============================================================

      - name: Discover OSGi components
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DISCOVERING OSGi COMPONENTS"
          echo "============================================================"

          COMPONENTS=(
            catalog
            customer
            security
            payment
            shipping
            notification
            orders
            reporting
            thirdparty
          )

          echo "Discovered components:"

          for component in "${COMPONENTS[@]}"; do
            echo "  - $component"
          done

          printf '%s\n' "${COMPONENTS[@]}" > components.txt

          {
            echo "components<<EOF"
            printf '%s\n' "${COMPONENTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. BUILD OSGi DEPENDENCY GRAPH
      # ============================================================

      - name: Build OSGi dependency graph
        id: graph
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING OSGi DEPENDENCY GRAPH"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          declare -A SYMBOLIC_NAME
          declare -A EXPORT_PACKAGES
          declare -A COMPONENT_FEATURE

          declare -A DEPENDENCIES
          declare -A DEPENDENTS

          # --------------------------------------------------------
          # Discover bundle metadata
          # --------------------------------------------------------

          for component in "${COMPONENTS[@]}"; do

            echo ""
            echo "Component: $component"

            manifest="$component/META-INF/MANIFEST.MF"

            symbolic_name=""

            if [[ -f "$manifest" ]]; then

              symbolic_name=$(
                awk -F': ' '
                  /^Bundle-SymbolicName:/ {
                    print $2
                    exit
                  }
                ' "$manifest" |
                sed 's/;.*//'
              )

            fi

            if [[ -z "$symbolic_name" ]]; then
              symbolic_name="$component"
            fi

            SYMBOLIC_NAME["$component"]="$symbolic_name"

            echo "  Bundle-SymbolicName: $symbolic_name"

            # ------------------------------------------------------
            # Export-Package
            # ------------------------------------------------------

            exports=""

            if [[ -f "$manifest" ]]; then

              exports=$(
                awk '
                  /^Export-Package:/ {
                    flag=1
                    sub(/^Export-Package:[[:space:]]*/, "")
                    printf "%s", $0
                    next
                  }

                  flag && /^[^[:space:]]/ {
                    flag=0
                  }

                  flag {
                    gsub(/^[[:space:]]+/, "")
                    printf "%s", $0
                  }

                  END {
                    print ""
                  }
                ' "$manifest"
              )

            fi

            EXPORT_PACKAGES["$component"]="$exports"

            # ------------------------------------------------------
            # Feature ID
            # ------------------------------------------------------

            feature_id=""

            if [[ -f "$component/feature.xml" ]]; then

              feature_id=$(
                sed -n 's/.*id="\([^"]*\)".*/\1/p' \
                  "$component/feature.xml" |
                head -1
              )

            fi

            COMPONENT_FEATURE["$component"]="$feature_id"

          done

          # --------------------------------------------------------
          # Helper
          #
          # Direction:
          #
          # dependency -> dependent
          #
          # Example:
          #
          # catalog -> orders
          #
          # means orders depends on catalog.
          # --------------------------------------------------------

          add_edge() {

            local dependency="$1"
            local dependent="$2"

            [[ "$dependency" == "$dependent" ]] && return

            DEPENDENTS["$dependency"]="${DEPENDENTS[$dependency]:-} $dependent"

            DEPENDENCIES["$dependent"]="${DEPENDENCIES[$dependent]:-} $dependency"

          }

          # ========================================================
          # Require-Bundle
          # ========================================================

          echo ""
          echo "Analyzing Require-Bundle dependencies..."

          for dependent in "${COMPONENTS[@]}"; do

            manifest="$dependent/META-INF/MANIFEST.MF"

            [[ -f "$manifest" ]] || continue

            require_bundle=$(
              awk '
                /^Require-Bundle:/ {
                  flag=1
                  sub(/^Require-Bundle:[[:space:]]*/, "")
                  printf "%s", $0
                  next
                }

                flag && /^[^[:space:]]/ {
                  flag=0
                }

                flag {
                  gsub(/^[[:space:]]+/, "")
                  printf "%s", $0
                }

                END {
                  print ""
                }
              ' "$manifest"
            )

            IFS=',' read -ra bundles <<< "$require_bundle"

            for bundle in "${bundles[@]}"; do

              bundle=$(echo "$bundle" | sed 's/;.*//' | xargs)

              [[ -z "$bundle" ]] && continue

              for dependency in "${COMPONENTS[@]}"; do

                if [[ "${SYMBOLIC_NAME[$dependency]:-}" == "$bundle" ]]; then

                  add_edge "$dependency" "$dependent"

                  echo "  $dependency -> $dependent"

                fi

              done

            done

          done

          # ========================================================
          # Import-Package -> Export-Package
          # ========================================================

          echo ""
          echo "Analyzing Import-Package / Export-Package dependencies..."

          for dependent in "${COMPONENTS[@]}"; do

            manifest="$dependent/META-INF/MANIFEST.MF"

            [[ -f "$manifest" ]] || continue

            imports=$(
              awk '
                /^Import-Package:/ {
                  flag=1
                  sub(/^Import-Package:[[:space:]]*/, "")
                  printf "%s", $0
                  next
                }

                flag && /^[^[:space:]]/ {
                  flag=0
                }

                flag {
                  gsub(/^[[:space:]]+/, "")
                  printf "%s", $0
                }

                END {
                  print ""
                }
              ' "$manifest"
            )

            IFS=',' read -ra packages <<< "$imports"

            for package in "${packages[@]}"; do

              package=$(echo "$package" | sed 's/;.*//' | xargs)

              [[ -z "$package" ]] && continue

              for dependency in "${COMPONENTS[@]}"; do

                exports="${EXPORT_PACKAGES[$dependency]:-}"

                if echo ",$exports," | grep -Fq ",$package,"; then

                  add_edge "$dependency" "$dependent"

                  echo "  $dependency -> $dependent"

                fi

              done

            done

          done

          # ========================================================
          # Feature dependencies
          # ========================================================

          echo ""
          echo "Analyzing feature dependencies..."

          for dependent in "${COMPONENTS[@]}"; do

            feature_xml="$dependent/feature.xml"

            [[ -f "$feature_xml" ]] || continue

            while read -r feature_ref; do

              [[ -z "$feature_ref" ]] && continue

              for dependency in "${COMPONENTS[@]}"; do

                if [[ "${COMPONENT_FEATURE[$dependency]:-}" == "$feature_ref" ]]; then

                  add_edge "$dependency" "$dependent"

                  echo "  $dependency -> $dependent"

                fi

              done

            done < <(
              sed -n 's/.*feature="\([^"]*\)".*/\1/p' \
                "$feature_xml"
            )

          done

          # ========================================================
          # Remove duplicate edges
          # ========================================================

          for component in "${COMPONENTS[@]}"; do

            DEPENDENCIES["$component"]=$(
              printf '%s\n' "${DEPENDENCIES[$component]:-}" |
              tr ' ' '\n' |
              awk 'NF && !seen[$0]++' |
              tr '\n' ' '
            )

            DEPENDENTS["$component"]=$(
              printf '%s\n' "${DEPENDENTS[$component]:-}" |
              tr ' ' '\n' |
              awk 'NF && !seen[$0]++' |
              tr '\n' ' '
            )

          done

          # ========================================================
          # Display graph
          # ========================================================

          echo ""
          echo "============================================================"
          echo "OSGi DEPENDENCY GRAPH"
          echo "============================================================"

          : > dependency-edges.txt

          for component in "${COMPONENTS[@]}"; do

            for dependent in ${DEPENDENTS[$component]:-}; do

              echo "  $component -> $dependent"

              echo "$component|$dependent" >> dependency-edges.txt

            done

          done

          # ========================================================
          # Generate graph report
          # ========================================================

          {
            echo "# OSGi Dependency Graph"
            echo ""
            echo "## Direction"
            echo ""
            echo "\`dependency -> dependent\`"
            echo ""
            echo "If \`A -> B\`, B depends on A."
            echo ""
            echo "## Graph"
            echo ""

            while IFS='|' read -r dependency dependent; do

              [[ -z "$dependency" ]] && continue

              echo "- \`$dependency\` → \`$dependent\`"

            done < dependency-edges.txt

          } > osgi-dependency-graph.md

      # ============================================================
      # 5. DETECT CHANGED COMPONENTS
      # ============================================================

      - name: Detect changed components
        id: changes
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DETECTING CHANGED OSGi COMPONENTS"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          MODE="${INPUT_MODE:-changed}"

          # --------------------------------------------------------
          # Determine comparison SHA
          # --------------------------------------------------------

          if [[ -n "${INPUT_BASE_SHA:-}" ]]; then

            BASE_SHA="$INPUT_BASE_SHA"

          elif [[ "$EVENT_NAME" == "pull_request" ]]; then

            BASE_SHA="${{ github.event.pull_request.base.sha }}"

          elif [[ -n "${BEFORE_SHA:-}" &&
                  "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then

            BASE_SHA="$BEFORE_SHA"

          else

            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"

          fi

          HEAD_SHA="${GITHUB_SHA}"

          echo "Mode     : $MODE"
          echo "Base SHA : $BASE_SHA"
          echo "Head SHA : $HEAD_SHA"
          echo ""

          # Always create the file.
          : > changed-components.txt

          # ========================================================
          # FULL BUILD
          # ========================================================

          if [[ "$MODE" == "all" ]]; then

            echo "Build mode: ALL"
            echo "Selecting all components."

            for component in "${COMPONENTS[@]}"; do

              echo "$component" >> changed-components.txt

            done

          else

            # ======================================================
            # CHANGED MODE
            # ======================================================

            if [[ -z "$BASE_SHA" ]]; then

              echo "WARNING: Unable to determine base SHA."
              echo "Falling back to full build."

              for component in "${COMPONENTS[@]}"; do
                echo "$component" >> changed-components.txt
              done

            else

              echo "Changed files:"
              echo ""

              mapfile -t CHANGED_FILES < <(
                git diff --name-only "$BASE_SHA" "$HEAD_SHA"
              )

              if [[ "${#CHANGED_FILES[@]}" -eq 0 ]]; then

                echo "  No files changed."

              else

                for file in "${CHANGED_FILES[@]}"; do
                  echo "  $file"
                done

              fi

              echo ""

              # ----------------------------------------------------
              # Map files to components
              # ----------------------------------------------------

              declare -A DIRECT_CHANGED

              for relative in "${CHANGED_FILES[@]}"; do

                # ----------------------------------------------
                # Product/component files
                # ----------------------------------------------

                for component in "${COMPONENTS[@]}"; do

                  if [[ "$relative" == "$component"/* ]]; then

                    DIRECT_CHANGED["$component"]=1

                  fi

                done

                # ----------------------------------------------
                # Root POM
                # ----------------------------------------------

                if [[ "$relative" == "pom.xml" ]]; then

                  echo "Root pom.xml changed."
                  echo "Selecting full build."

                  for component in "${COMPONENTS[@]}"; do
                    DIRECT_CHANGED["$component"]=1
                  done

                fi

                # ----------------------------------------------
                # Maven configuration
                # ----------------------------------------------

                if [[ "$relative" == ".mvn/"* ]]; then

                  echo ".mvn configuration changed."
                  echo "Selecting full build."

                  for component in "${COMPONENTS[@]}"; do
                    DIRECT_CHANGED["$component"]=1
                  done

                fi

                # ----------------------------------------------
                # GitHub workflow
                #
                # IMPORTANT:
                # Workflow-only changes do NOT select products.
                # ----------------------------------------------

                if [[ "$relative" == ".github/workflows/"* ]]; then

                  echo "Workflow file changed:"
                  echo "  $relative"

                  echo "Workflow changes do NOT automatically"
                  echo "mark OSGi components as changed."

                fi

              done

              # ----------------------------------------------------
              # Write direct changes
              # ----------------------------------------------------

              for component in "${COMPONENTS[@]}"; do

                if [[ "${DIRECT_CHANGED[$component]:-0}" == "1" ]]; then

                  echo "$component" >> changed-components.txt

                fi

              done

            fi

          fi

          # ========================================================
          # DISPLAY RESULT
          # ========================================================

          echo ""
          echo "============================================================"
          echo "DIRECTLY CHANGED OSGi COMPONENTS"
          echo "============================================================"

          if [[ -s changed-components.txt ]]; then

            while read -r component; do

              [[ -z "$component" ]] && continue

              echo "  [CHANGED] $component"

            done < changed-components.txt

          else

            echo "  None"

          fi

          echo ""

          CHANGED_COUNT=0

          if [[ -s changed-components.txt ]]; then

            CHANGED_COUNT=$(
              grep -cve '^[[:space:]]*$' changed-components.txt
            )

          fi

          echo "Changed component count: $CHANGED_COUNT"

          {
            echo "changed_count=$CHANGED_COUNT"
            echo "base_sha=$BASE_SHA"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. CALCULATE DEPENDENCY-AWARE REBUILD SET
      # ============================================================

      - name: Calculate rebuild set
        id: selection
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CALCULATING DEPENDENCY-AWARE REBUILD SET"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          declare -A SELECTED
          declare -A DEPENDENTS

          : > selected-components.txt

          # --------------------------------------------------------
          # Read directly changed components
          # --------------------------------------------------------

          if [[ -s changed-components.txt ]]; then

            while read -r component; do

              [[ -z "$component" ]] && continue

              SELECTED["$component"]=1

            done < changed-components.txt

          fi

          # --------------------------------------------------------
          # Read dependency graph
          # --------------------------------------------------------

          if [[ -s dependency-edges.txt ]]; then

            while IFS='|' read -r dependency dependent; do

              [[ -z "$dependency" ]] && continue
              [[ -z "$dependent" ]] && continue

              DEPENDENTS["$dependency"]="${DEPENDENTS[$dependency]:-} $dependent"

            done < dependency-edges.txt

          fi

          # --------------------------------------------------------
          # No direct changes
          # --------------------------------------------------------

          if [[ ! -s changed-components.txt ]]; then

            echo "No OSGi components changed."
            echo "No components require rebuilding."

          else

            echo "Directly changed components:"

            while read -r component; do

              [[ -z "$component" ]] && continue

              echo "  - $component"

            done < changed-components.txt

            echo ""
            echo "Calculating transitive dependents..."

            # ------------------------------------------------------
            # BFS through dependent graph
            # ------------------------------------------------------

            queue=()

            while read -r component; do

              [[ -z "$component" ]] && continue

              queue+=("$component")

            done < changed-components.txt

            index=0

            while [[ "$index" -lt "${#queue[@]}" ]]; do

              current="${queue[$index]}"

              index=$((index + 1))

              for dependent in ${DEPENDENTS[$current]:-}; do

                if [[ "${SELECTED[$dependent]:-0}" != "1" ]]; then

                  SELECTED["$dependent"]=1

                  queue+=("$dependent")

                  echo "  Dependency impact:"
                  echo "    $current -> $dependent"

                fi

              done

            done

          fi

          # ========================================================
          # FINAL REBUILD SET
          # ========================================================

          echo ""
          echo "============================================================"
          echo "FINAL REBUILD SET"
          echo "============================================================"

          SELECTED_COUNT=0

          for component in "${COMPONENTS[@]}"; do

            if [[ "${SELECTED[$component]:-0}" == "1" ]]; then

              if grep -Fxq "$component" changed-components.txt 2>/dev/null; then

                echo "  [CHANGED]    $component"

              else

                echo "  [DEPENDENCY] $component"

              fi

              echo "$component" >> selected-components.txt

              SELECTED_COUNT=$((SELECTED_COUNT + 1))

            fi

          done

          if [[ "$SELECTED_COUNT" -eq 0 ]]; then
            echo "  None"
          fi

          echo ""
          echo "Total selected: $SELECTED_COUNT"

          echo "selected_count=$SELECTED_COUNT" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. CALCULATE BUILD ORDER
      # ============================================================

      - name: Calculate OSGi build order
        id: order
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CALCULATING OSGi BUILD ORDER"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          declare -A SELECTED
          declare -A IN_DEGREE
          declare -A DEPENDENTS

          # --------------------------------------------------------
          # Read selected components
          # --------------------------------------------------------

          if [[ -s selected-components.txt ]]; then

            while read -r component; do

              [[ -z "$component" ]] && continue

              SELECTED["$component"]=1
              IN_DEGREE["$component"]=0

            done < selected-components.txt

          fi

          # --------------------------------------------------------
          # Read dependency graph
          # --------------------------------------------------------

          if [[ -s dependency-edges.txt ]]; then

            while IFS='|' read -r dependency dependent; do

              [[ -z "$dependency" ]] && continue
              [[ -z "$dependent" ]] && continue

              DEPENDENTS["$dependency"]="${DEPENDENTS[$dependency]:-} $dependent"

              # Only calculate edges inside the selected subgraph.

              if [[ "${SELECTED[$dependency]:-0}" == "1" &&
                    "${SELECTED[$dependent]:-0}" == "1" ]]; then

                IN_DEGREE["$dependent"]=$(
                  (
                    ${IN_DEGREE[$dependent]:-0} + 1
                  )
                )

              fi

            done < dependency-edges.txt

          fi

          # --------------------------------------------------------
          # Fix Bash arithmetic safely
          # --------------------------------------------------------

          # Recalculate using safe arithmetic syntax.
          #
          # This avoids the previous:
          #
          #   CHANGED: unbound variable
          #
          # and:
          #
          #   0: command not found
          #

          if [[ -s selected-components.txt ]]; then

            # Reset indegrees.

            for component in "${COMPONENTS[@]}"; do

              if [[ "${SELECTED[$component]:-0}" == "1" ]]; then
                IN_DEGREE["$component"]=0
              fi

            done

            while IFS='|' read -r dependency dependent; do

              [[ -z "$dependency" ]] && continue
              [[ -z "$dependent" ]] && continue

              if [[ "${SELECTED[$dependency]:-0}" == "1" &&
                    "${SELECTED[$dependent]:-0}" == "1" ]]; then

                current_degree="${IN_DEGREE[$dependent]:-0}"

                IN_DEGREE["$dependent"]=$((current_degree + 1))

              fi

            done < dependency-edges.txt

          fi

          # ========================================================
          # TOPOLOGICAL SORT
          # ========================================================

          queue=()
          BUILD_ORDER=()

          for component in "${COMPONENTS[@]}"; do

            if [[ "${SELECTED[$component]:-0}" == "1" &&
                  "${IN_DEGREE[$component]:-0}" -eq 0 ]]; then

              queue+=("$component")

            fi

          done

          while [[ "${#queue[@]}" -gt 0 ]]; do

            current="${queue[0]}"

            queue=("${queue[@]:1}")

            BUILD_ORDER+=("$current")

            for dependent in ${DEPENDENTS[$current]:-}; do

              if [[ "${SELECTED[$dependent]:-0}" == "1" ]]; then

                current_degree="${IN_DEGREE[$dependent]:-0}"

                new_degree=$((current_degree - 1))

                IN_DEGREE["$dependent"]="$new_degree"

                if [[ "$new_degree" -eq 0 ]]; then

                  queue+=("$dependent")

                fi

              fi

            done

          done

          # ========================================================
          # VALIDATE BUILD ORDER
          # ========================================================

          SELECTED_COUNT=0

          if [[ -s selected-components.txt ]]; then

            SELECTED_COUNT=$(
              grep -cve '^[[:space:]]*$' selected-components.txt
            )

          fi

          if [[ "${#BUILD_ORDER[@]}" -ne "$SELECTED_COUNT" ]]; then

            echo ""
            echo "ERROR: Unable to calculate a valid dependency order."
            echo ""
            echo "Selected components : $SELECTED_COUNT"
            echo "Build order entries : ${#BUILD_ORDER[@]}"
            echo ""

            exit 1

          fi

          # ========================================================
          # WRITE BUILD ORDER
          # ========================================================

          : > build-order.txt

          echo ""
          echo "============================================================"
          echo "FINAL OSGi BUILD ORDER"
          echo "============================================================"

          POSITION=1

          for component in "${BUILD_ORDER[@]}"; do

            echo "$POSITION. $component"

            echo "$component" >> build-order.txt

            POSITION=$((POSITION + 1))

          done

          if [[ "$SELECTED_COUNT" -eq 0 ]]; then

            echo "No components require rebuilding."

          fi

      # ============================================================
      # 8. GENERATE DEPENDENCY PATH REPORT
      # ============================================================

      - name: Generate dependency reports
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GENERATING DEPENDENCY REPORTS"
          echo "============================================================"

          mapfile -t COMPONENTS < components.txt

          declare -A DEPENDENTS

          if [[ -s dependency-edges.txt ]]; then

            while IFS='|' read -r dependency dependent; do

              [[ -z "$dependency" ]] && continue
              [[ -z "$dependent" ]] && continue

              DEPENDENTS["$dependency"]="${DEPENDENTS[$dependency]:-} $dependent"

            done < dependency-edges.txt

          fi

          # ========================================================
          # DEPENDENCY PATH REPORT
          # ========================================================

          {
            echo "# OSGi Dependency Paths"
            echo ""
            echo "Dependency direction:"
            echo ""
            echo "\`dependency -> dependent\`"
            echo ""

            echo "## Changed Components"
            echo ""

            if [[ -s changed-components.txt ]]; then

              while read -r changed; do

                [[ -z "$changed" ]] && continue

                echo "### $changed"
                echo ""

                echo "**Direct dependents:**"

                found=false

                for dependent in ${DEPENDENTS[$changed]:-}; do

                  echo "- \`$changed\` → \`$dependent\`"

                  found=true

                done

                if [[ "$found" == "false" ]]; then
                  echo "- None"
                fi

                echo ""

              done < changed-components.txt

            else

              echo "No OSGi components changed."

            fi

            echo ""
            echo "## Selected Rebuild Components"
            echo ""

            if [[ -s selected-components.txt ]]; then

              while read -r component; do

                echo "- \`$component\`"

              done < selected-components.txt

            else

              echo "None"

            fi

          } > osgi-dependency-paths.md

          # ========================================================
          # SMART BUILD REPORT
          # ========================================================

          {
            echo "# OSGi Smart Build Report"
            echo ""

            echo "## Build Information"
            echo ""

            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: \`${GITHUB_RUN_ID}\`"
            echo ""

            echo "## Changed Components"
            echo ""

            if [[ -s changed-components.txt ]]; then

              while read -r component; do
                echo "- \`$component\`"
              done < changed-components.txt

            else

              echo "- None"

            fi

            echo ""
            echo "## Selected Rebuild Components"
            echo ""

            if [[ -s selected-components.txt ]]; then

              while read -r component; do
                echo "- \`$component\`"
              done < selected-components.txt

            else

              echo "- None"

            fi

            echo ""
            echo "## Build Order"
            echo ""

            if [[ -s build-order.txt ]]; then

              position=1

              while read -r component; do

                echo "$position. \`$component\`"

                position=$((position + 1))

              done < build-order.txt

            else

              echo "No components rebuilt."

            fi

          } > osgi-smart-build-report.md

      # ============================================================
      # 9. GITHUB JOB SUMMARY
      # ============================================================

      - name: Publish build summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# OSGi Smart Build"
            echo ""

            echo "## Changed Components"
            echo ""

            if [[ -s changed-components.txt ]]; then

              while read -r component; do

                echo "- **$component**"

              done < changed-components.txt

            else

              echo "- None"

            fi

            echo ""
            echo "## Selected Rebuild Components"
            echo ""

            if [[ -s selected-components.txt ]]; then

              while read -r component; do

                echo "- **$component**"

              done < selected-components.txt

            else

              echo "- None"

            fi

            echo ""
            echo "## Build Order"
            echo ""

            if [[ -s build-order.txt ]]; then

              position=1

              while read -r component; do

                echo "$position. **$component**"

                position=$((position + 1))

              done < build-order.txt

            else

              echo "No components rebuilt."

            fi

            echo ""
            echo "## Dependency Graph"
            echo ""

            cat osgi-dependency-graph.md

          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 10. BUILD SELECTED COMPONENTS
      # ============================================================

      - name: Build selected OSGi components
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "BUILDING SELECTED OSGi COMPONENTS"
          echo "============================================================"

          # --------------------------------------------------------
          # IMPORTANT:
          #
          # Do not use:
          #
          #   hashFiles('selected-components.txt')
          #
          # because the file exists even when it is empty.
          # --------------------------------------------------------

          if [[ ! -s selected-components.txt ]]; then

            echo ""
            echo "No OSGi components require rebuilding."
            echo "Smart build completed successfully."

            exit 0

          fi

          POSITION=1

          while read -r component; do

            [[ -z "$component" ]] && continue

            echo ""
            echo "============================================================"
            echo "BUILD [$POSITION] : $component"
            echo "============================================================"

            if [[ ! -f "$component/pom.xml" ]]; then

              echo "ERROR: Missing $component/pom.xml"

              exit 1

            fi

            mvn \
              -B \
              -ntp \
              -f "$component/pom.xml" \
              clean install \
              -DskipTests \
              -Dtycho.localArtifacts=default

            echo ""
            echo "SUCCESS: $component"

            POSITION=$((POSITION + 1))

          done < build-order.txt

          echo ""
          echo "============================================================"
          echo "OSGi SMART BUILD COMPLETED SUCCESSFULLY"
          echo "============================================================"

      # ============================================================
      # 11. UPLOAD REPORTS
      # ============================================================

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: northwind-osgi-build-report
          path: |
            components.txt
            changed-components.txt
            selected-components.txt
            build-order.txt
            dependency-edges.txt
            osgi-dependency-graph.md
            osgi-dependency-paths.md
            osgi-smart-build-report.md
          if-no-files-found: warn

      # ============================================================
      # 12. UPLOAD BUILD ARTIFACTS
      # ============================================================

      - name: Upload OSGi artifacts
        if: success() && hashFiles('selected-components.txt') != ''
        uses: actions/upload-artifact@v5
        with:
          name: northwind-osgi-artifacts
          path: |
            **/target/*.jar
            **/target/*.zip
          if-no-files-found: warn