name: OSGi Smart Build

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all

      base_sha:
        description: "Optional base SHA for changed-module detection"
        required: false
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  WORK_DIR: "osgi-workshop"

jobs:

  smart-build:
    name: OSGi Smart Build
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. JAVA
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # ------------------------------------------------------------
      # 3. DISCOVER OSGi METADATA
      # ------------------------------------------------------------
      - name: Discover OSGi metadata
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${WORK_DIR}"
          GRAPH_DIR="${WORK_DIR}/.smart-build"

          rm -rf "${GRAPH_DIR}"
          mkdir -p "${GRAPH_DIR}"

          echo "============================================================"
          echo "OSGi METADATA DISCOVERY"
          echo "============================================================"

          declare -A BUNDLE_TO_COMPONENT
          declare -A COMPONENT_TO_BUNDLE
          declare -A EXPORTED_PACKAGE_OWNER

          COMPONENTS=()

          for POM in "${WORK_DIR}"/*/pom.xml; do
            COMPONENT="$(dirname "${POM}")"
            COMPONENT="${COMPONENT#${WORK_DIR}/}"

            [[ "${COMPONENT}" == "." ]] && continue

            COMPONENTS+=("${COMPONENT}")

            MANIFEST="${WORK_DIR}/${COMPONENT}/META-INF/MANIFEST.MF"

            if [[ ! -f "${MANIFEST}" ]]; then
              echo "WARN: No MANIFEST.MF found for ${COMPONENT}"
              continue
            fi

            BUNDLE_NAME="$(
              awk '
                /^Bundle-SymbolicName:/ {
                  value=$0
                  sub(/^Bundle-SymbolicName:[[:space:]]*/, "", value)
                  sub(/;.*/, "", value)
                  print value
                  exit
                }
              ' "${MANIFEST}"
            )"

            if [[ -z "${BUNDLE_NAME}" ]]; then
              echo "WARN: Bundle-SymbolicName not found for ${COMPONENT}"
              continue
            fi

            BUNDLE_TO_COMPONENT["${BUNDLE_NAME}"]="${COMPONENT}"
            COMPONENT_TO_BUNDLE["${COMPONENT}"]="${BUNDLE_NAME}"

            echo "Bundle:"
            echo "  Component : ${COMPONENT}"
            echo "  Symbolic  : ${BUNDLE_NAME}"

            EXPORTS="$(
              awk '
                /^Export-Package:/,/^[^ ]/ {
                  if ($0 ~ /^Export-Package:/) {
                    line=$0
                    sub(/^Export-Package:[[:space:]]*/, "", line)
                    print line
                  }
                  else if ($0 ~ /^[[:space:]]+/) {
                    line=$0
                    gsub(/^[[:space:]]+/, "", line)
                    print line
                  }
                }
              ' "${MANIFEST}" |
              tr ',' '\n' |
              sed 's/;.*//g' |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              grep -v '^$' || true
            )"

            while IFS= read -r PACKAGE; do
              [[ -z "${PACKAGE}" ]] && continue

              EXPORTED_PACKAGE_OWNER["${PACKAGE}"]="${COMPONENT}"

              echo "  Export    : ${PACKAGE}"
            done <<< "${EXPORTS}"
          done

          printf '%s\n' "${COMPONENTS[@]}" |
            sort -u > "${GRAPH_DIR}/components.txt"

          echo
          echo "Components discovered:"
          cat "${GRAPH_DIR}/components.txt"

          echo
          echo "Total components: $(wc -l < "${GRAPH_DIR}/components.txt")"

          # --------------------------------------------------------
          # Feature discovery
          # --------------------------------------------------------

          declare -A FEATURE_TO_COMPONENT

          while IFS= read -r FEATURE_XML; do

            FEATURE_DIR="$(dirname "${FEATURE_XML}")"
            COMPONENT="$(echo "${FEATURE_DIR}" | sed "s#^${WORK_DIR}/##")"

            FEATURE_ID="$(
              sed -n 's/.*<feature[^>]*id="\\([^"]*\\)".*/\1/p' \
                "${FEATURE_XML}" |
              head -1
            )"

            if [[ -n "${FEATURE_ID}" ]]; then
              FEATURE_TO_COMPONENT["${FEATURE_ID}"]="${COMPONENT}"

              echo "Feature:"
              echo "  ID        : ${FEATURE_ID}"
              echo "  Component : ${COMPONENT}"
            fi

          done < <(
            find "${WORK_DIR}" \
              -type f \
              -name "feature.xml" \
              | sort
          )

          echo
          echo "OSGi metadata discovery complete."

      # ------------------------------------------------------------
      # 4. DETECT CHANGED MODULES
      # ------------------------------------------------------------
      - name: Detect changed modules
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${WORK_DIR}"
          GRAPH_DIR="${WORK_DIR}/.smart-build"

          echo "============================================================"
          echo "CHANGE DETECTION"
          echo "============================================================"

          MODE="${{ inputs.mode || 'changed' }}"
          BASE_SHA="${{ inputs.base_sha || '' }}"

          if [[ "${MODE}" == "all" ]]; then
            echo "Build mode: ALL"

            find "${WORK_DIR}" \
              -mindepth 2 \
              -maxdepth 2 \
              -name pom.xml \
              -printf '%h\n' |
              sed "s#^${WORK_DIR}/##" |
              sort -u > "${GRAPH_DIR}/changed-components.txt"

          else

            echo "Build mode: CHANGED"

            if [[ -z "${BASE_SHA}" ]]; then

              if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                BASE_SHA="${{ github.event.pull_request.base.sha }}"
              else
                BASE_SHA="${{ github.event.before }}"
              fi

            fi

            if [[ -z "${BASE_SHA}" ||
                  "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then

              echo "No usable base SHA found."
              echo "Falling back to HEAD~1."

              BASE_SHA="$(git rev-parse HEAD~1)"

            fi

            echo "Base SHA: ${BASE_SHA}"
            echo "Head SHA: $(git rev-parse HEAD)"

            git diff --name-only "${BASE_SHA}" HEAD |
              tee "${GRAPH_DIR}/changed-files.txt"

            : > "${GRAPH_DIR}/changed-components.txt"

            while IFS= read -r FILE; do

              [[ -z "${FILE}" ]] && continue

              if [[ "${FILE}" == "${WORK_DIR}/"* ]]; then

                REL="${FILE#${WORK_DIR}/}"
                COMPONENT="${REL%%/*}"

                if [[ -f "${WORK_DIR}/${COMPONENT}/pom.xml" ]]; then
                  echo "${COMPONENT}" >> \
                    "${GRAPH_DIR}/changed-components.txt"
                fi

              fi

              # Workflow changes are treated as full rebuilds because
              # build logic itself changed.
              if [[ "${FILE}" == ".github/workflows/"* ]]; then

                echo
                echo "Workflow change detected."
                echo "For safety, selecting all OSGi components."

                cat "${GRAPH_DIR}/components.txt" \
                  > "${GRAPH_DIR}/changed-components.txt"

                break
              fi

            done < "${GRAPH_DIR}/changed-files.txt"

            sort -u \
              "${GRAPH_DIR}/changed-components.txt" \
              -o "${GRAPH_DIR}/changed-components.txt"

          fi

          echo
          echo "Changed components:"
          cat "${GRAPH_DIR}/changed-components.txt" || true

          echo
          echo "Changed component count:"
          wc -l < "${GRAPH_DIR}/changed-components.txt"

      # ------------------------------------------------------------
      # 5. BUILD DEPENDENCY GRAPH
      # ------------------------------------------------------------
      - name: Build OSGi dependency graph
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${WORK_DIR}"
          GRAPH_DIR="${WORK_DIR}/.smart-build"

          echo "============================================================"
          echo "BUILDING OSGi DEPENDENCY GRAPH"
          echo "============================================================"

          GRAPH_FILE="${GRAPH_DIR}/graph.tsv"
          : > "${GRAPH_FILE}"

          declare -A BUNDLE_TO_COMPONENT
          declare -A EXPORTED_PACKAGE_OWNER
          declare -A FEATURE_TO_COMPONENT

          # --------------------------------------------------------
          # Bundle -> component
          # --------------------------------------------------------

          while IFS= read -r POM; do

            COMPONENT="$(dirname "${POM}")"
            COMPONENT="${COMPONENT#${WORK_DIR}/}"

            MANIFEST="${WORK_DIR}/${COMPONENT}/META-INF/MANIFEST.MF"

            [[ ! -f "${MANIFEST}" ]] && continue

            BUNDLE_NAME="$(
              awk '
                /^Bundle-SymbolicName:/ {
                  value=$0
                  sub(/^Bundle-SymbolicName:[[:space:]]*/, "", value)
                  sub(/;.*/, "", value)
                  print value
                  exit
                }
              ' "${MANIFEST}"
            )"

            [[ -z "${BUNDLE_NAME}" ]] && continue

            BUNDLE_TO_COMPONENT["${BUNDLE_NAME}"]="${COMPONENT}"

            EXPORTS="$(
              awk '
                /^Export-Package:/,/^[^ ]/ {
                  if ($0 ~ /^Export-Package:/) {
                    line=$0
                    sub(/^Export-Package:[[:space:]]*/, "", line)
                    print line
                  }
                  else if ($0 ~ /^[[:space:]]+/) {
                    line=$0
                    gsub(/^[[:space:]]+/, "", line)
                    print line
                  }
                }
              ' "${MANIFEST}" |
              tr ',' '\n' |
              sed 's/;.*//g' |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              grep -v '^$' || true
            )"

            while IFS= read -r PACKAGE; do
              [[ -z "${PACKAGE}" ]] && continue
              EXPORTED_PACKAGE_OWNER["${PACKAGE}"]="${COMPONENT}"
            done <<< "${EXPORTS}"

          done < <(
            find "${WORK_DIR}" \
              -mindepth 2 \
              -maxdepth 2 \
              -name pom.xml |
            sort
          )

          # --------------------------------------------------------
          # Feature -> component
          # --------------------------------------------------------

          while IFS= read -r FEATURE_XML; do

            FEATURE_DIR="$(dirname "${FEATURE_XML}")"
            COMPONENT="$(echo "${FEATURE_DIR}" | sed "s#^${WORK_DIR}/##")"

            FEATURE_ID="$(
              sed -n 's/.*<feature[^>]*id="\\([^"]*\\)".*/\1/p' \
                "${FEATURE_XML}" |
              head -1
            )"

            [[ -z "${FEATURE_ID}" ]] && continue

            FEATURE_TO_COMPONENT["${FEATURE_ID}"]="${COMPONENT}"

          done < <(
            find "${WORK_DIR}" \
              -type f \
              -name feature.xml |
            sort
          )

          # --------------------------------------------------------
          # Helper
          #
          # Graph direction:
          #
          # dependency -> dependent
          #
          # Example:
          #
          # catalog -> orders
          #
          # means orders depends on catalog.
          # --------------------------------------------------------

          add_edge() {

            local DEPENDENCY="$1"
            local DEPENDENT="$2"
            local REASON="$3"

            [[ -z "${DEPENDENCY}" ]] && return
            [[ -z "${DEPENDENT}" ]] && return

            # Ignore self-dependencies.
            [[ "${DEPENDENCY}" == "${DEPENDENT}" ]] && return

            printf '%s\t%s\t%s\n' \
              "${DEPENDENCY}" \
              "${DEPENDENT}" \
              "${REASON}" \
              >> "${GRAPH_FILE}"
          }

          # --------------------------------------------------------
          # Parse bundle dependencies
          # --------------------------------------------------------

          while IFS= read -r POM; do

            COMPONENT="$(dirname "${POM}")"
            COMPONENT="${COMPONENT#${WORK_DIR}/}"

            MANIFEST="${WORK_DIR}/${COMPONENT}/META-INF/MANIFEST.MF"

            [[ ! -f "${MANIFEST}" ]] && continue

            # ------------------------------------------------------
            # Require-Bundle
            # ------------------------------------------------------

            REQUIRE_BUNDLES="$(
              awk '
                /^Require-Bundle:/,/^[^ ]/ {
                  if ($0 ~ /^Require-Bundle:/) {
                    line=$0
                    sub(/^Require-Bundle:[[:space:]]*/, "", line)
                    print line
                  }
                  else if ($0 ~ /^[[:space:]]+/) {
                    line=$0
                    gsub(/^[[:space:]]+/, "", line)
                    print line
                  }
                }
              ' "${MANIFEST}" |
              tr ',' '\n' |
              sed 's/;.*//g' |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              grep -v '^$' || true
            )"

            while IFS= read -r REQUIRED_BUNDLE; do

              [[ -z "${REQUIRED_BUNDLE}" ]] && continue

              DEPENDENCY="${BUNDLE_TO_COMPONENT[${REQUIRED_BUNDLE}]:-}"

              if [[ -n "${DEPENDENCY}" ]]; then
                add_edge \
                  "${DEPENDENCY}" \
                  "${COMPONENT}" \
                  "Require-Bundle:${REQUIRED_BUNDLE}"
              fi

            done <<< "${REQUIRE_BUNDLES}"

            # ------------------------------------------------------
            # Import-Package
            # ------------------------------------------------------

            IMPORT_PACKAGES="$(
              awk '
                /^Import-Package:/,/^[^ ]/ {
                  if ($0 ~ /^Import-Package:/) {
                    line=$0
                    sub(/^Import-Package:[[:space:]]*/, "", line)
                    print line
                  }
                  else if ($0 ~ /^[[:space:]]+/) {
                    line=$0
                    gsub(/^[[:space:]]+/, "", line)
                    print line
                  }
                }
              ' "${MANIFEST}" |
              tr ',' '\n' |
              sed 's/;.*//g' |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              grep -v '^$' || true
            )"

            while IFS= read -r PACKAGE; do

              [[ -z "${PACKAGE}" ]] && continue

              DEPENDENCY="${EXPORTED_PACKAGE_OWNER[${PACKAGE}]:-}"

              if [[ -n "${DEPENDENCY}" ]]; then
                add_edge \
                  "${DEPENDENCY}" \
                  "${COMPONENT}" \
                  "Import-Package:${PACKAGE}"
              fi

            done <<< "${IMPORT_PACKAGES}"

          done < <(
            find "${WORK_DIR}" \
              -mindepth 2 \
              -maxdepth 2 \
              -name pom.xml |
            sort
          )

          # --------------------------------------------------------
          # Feature dependencies
          # --------------------------------------------------------

          while IFS= read -r FEATURE_XML; do

            FEATURE_DIR="$(dirname "${FEATURE_XML}")"
            COMPONENT="$(echo "${FEATURE_DIR}" | sed "s#^${WORK_DIR}/##")"

            IMPORTS="$(
              grep -oE '<import-feature[^>]*id="[^"]+"' \
                "${FEATURE_XML}" 2>/dev/null |
              sed 's/.*id="//;s/"$//' |
              sort -u || true
            )"

            while IFS= read -r FEATURE_ID; do

              [[ -z "${FEATURE_ID}" ]] && continue

              DEPENDENCY="${FEATURE_TO_COMPONENT[${FEATURE_ID}]:-}"

              if [[ -n "${DEPENDENCY}" ]]; then
                add_edge \
                  "${DEPENDENCY}" \
                  "${COMPONENT}" \
                  "Feature:${FEATURE_ID}"
              fi

            done <<< "${IMPORTS}"

          done < <(
            find "${WORK_DIR}" \
              -type f \
              -name feature.xml |
            sort
          )

          # --------------------------------------------------------
          # Deduplicate graph
          # --------------------------------------------------------

          sort -u "${GRAPH_FILE}" -o "${GRAPH_FILE}"

          echo
          echo "Dependency graph:"
          echo

          while IFS=$'\t' read -r DEPENDENCY DEPENDENT REASON; do
            echo "${DEPENDENCY} -> ${DEPENDENT} (${REASON})"
          done < "${GRAPH_FILE}"

          echo
          echo "Graph edges: $(wc -l < "${GRAPH_FILE}")"

      # ------------------------------------------------------------
      # 6. CALCULATE TRANSITIVE DEPENDENTS + BUILD ORDER
      # ------------------------------------------------------------
      - name: Calculate OSGi build order
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${WORK_DIR}"
          GRAPH_DIR="${WORK_DIR}/.smart-build"

          GRAPH_FILE="${GRAPH_DIR}/graph.tsv"
          CHANGED_FILE="${GRAPH_DIR}/changed-components.txt"
          COMPONENTS_FILE="${GRAPH_DIR}/components.txt"

          SELECTED_FILE="${GRAPH_DIR}/selected-components.txt"
          BUILD_ORDER_FILE="${GRAPH_DIR}/build-order.txt"
          PATHS_FILE="${GRAPH_DIR}/dependency-paths.txt"

          echo "============================================================"
          echo "CALCULATING OSGi BUILD ORDER"
          echo "============================================================"

          declare -A SELECTED
          declare -A REVERSE_EDGES
          declare -A IN_DEGREE

          # --------------------------------------------------------
          # Initialize all components.
          # --------------------------------------------------------

          while IFS= read -r COMPONENT; do
            [[ -z "${COMPONENT}" ]] && continue
            IN_DEGREE["${COMPONENT}"]=0
          done < "${COMPONENTS_FILE}"

          # --------------------------------------------------------
          # Load dependency graph.
          #
          # dependency -> dependent
          # --------------------------------------------------------

          while IFS=$'\t' read -r DEPENDENCY DEPENDENT REASON; do

            [[ -z "${DEPENDENCY}" ]] && continue
            [[ -z "${DEPENDENT}" ]] && continue

            REVERSE_EDGES["${DEPENDENCY}"]="${REVERSE_EDGES[${DEPENDENCY}]:-} ${DEPENDENT}"

            # IMPORTANT:
            # Bash arithmetic must use (( ... )) or $(( ... )).
            # Do NOT use command substitution around arithmetic.
            IN_DEGREE["${DEPENDENT}"]=$(( ${IN_DEGREE[${DEPENDENT}]:-0} + 1 ))

          done < "${GRAPH_FILE}"

          # --------------------------------------------------------
          # All mode
          # --------------------------------------------------------

          MODE="${{ inputs.mode || 'changed' }}"

          if [[ "${MODE}" == "all" ]]; then

            while IFS= read -r COMPONENT; do
              [[ -z "${COMPONENT}" ]] && continue
              SELECTED["${COMPONENT}"]=1
            done < "${COMPONENTS_FILE}"

          else

            # ------------------------------------------------------
            # Start with directly changed components.
            # ------------------------------------------------------

            while IFS= read -r COMPONENT; do

              [[ -z "${COMPONENT}" ]] && continue

              SELECTED["${COMPONENT}"]=1

            done < "${CHANGED_FILE}"

            # ------------------------------------------------------
            # Walk dependency -> dependent.
            #
            # If catalog changes:
            #
            # catalog -> orders
            # orders  -> reporting
            #
            # then:
            #
            # catalog
            # orders
            # reporting
            #
            # all need rebuilding.
            # ------------------------------------------------------

            QUEUE=()

            while IFS= read -r COMPONENT; do
              [[ -z "${COMPONENT}" ]] && continue
              QUEUE+=("${COMPONENT}")
            done < "${CHANGED_FILE}"

            Q_INDEX=0

            while [[ "${Q_INDEX}" -lt "${#QUEUE[@]}" ]]; do

              CURRENT="${QUEUE[${Q_INDEX}]}"
              Q_INDEX=$((Q_INDEX + 1))

              for DEPENDENT in ${REVERSE_EDGES[${CURRENT}]:-}; do

                [[ -z "${DEPENDENT}" ]] && continue

                if [[ -z "${SELECTED[${DEPENDENT}]:-}" ]]; then

                  SELECTED["${DEPENDENT}"]=1
                  QUEUE+=("${DEPENDENT}")

                fi

              done

            done

          fi

          # --------------------------------------------------------
          # Write selected components.
          # --------------------------------------------------------

          : > "${SELECTED_FILE}"

          while IFS= read -r COMPONENT; do

            [[ -z "${COMPONENT}" ]] && continue

            if [[ -n "${SELECTED[${COMPONENT}]:-}" ]]; then
              echo "${COMPONENT}" >> "${SELECTED_FILE}"
            fi

          done < "${COMPONENTS_FILE}"

          echo
          echo "Selected components:"
          cat "${SELECTED_FILE}"

          # --------------------------------------------------------
          # Calculate topological build order.
          #
          # Only selected components participate in the sort.
          # --------------------------------------------------------

          declare -A SELECTED_IN_DEGREE
          declare -A DEPENDENTS

          while IFS= read -r COMPONENT; do

            [[ -z "${COMPONENT}" ]] && continue

            SELECTED_IN_DEGREE["${COMPONENT}"]=0

          done < "${SELECTED_FILE}"

          while IFS=$'\t' read -r DEPENDENCY DEPENDENT REASON; do

            [[ -z "${DEPENDENCY}" ]] && continue
            [[ -z "${DEPENDENT}" ]] && continue

            if [[ -n "${SELECTED[${DEPENDENCY}]:-}" &&
                  -n "${SELECTED[${DEPENDENT}]:-}" ]]; then

              DEPENDENTS["${DEPENDENCY}"]="${DEPENDENTS[${DEPENDENCY}]:-} ${DEPENDENT}"

              SELECTED_IN_DEGREE["${DEPENDENT}"]=$(
                echo "$(( ${SELECTED_IN_DEGREE[${DEPENDENT}]:-0} + 1 ))"
              )

            fi

          done < "${GRAPH_FILE}"

          # --------------------------------------------------------
          # Kahn topological sort.
          # --------------------------------------------------------

          READY=()

          while IFS= read -r COMPONENT; do

            [[ -z "${COMPONENT}" ]] && continue

            if [[ "${SELECTED_IN_DEGREE[${COMPONENT}]:-0}" -eq 0 ]]; then
              READY+=("${COMPONENT}")
            fi

          done < "${SELECTED_FILE}"

          # Stable ordering.
          mapfile -t READY < <(
            printf '%s\n' "${READY[@]}" |
            sort
          )

          : > "${BUILD_ORDER_FILE}"

          BUILD_NUMBER=1

          while [[ "${#READY[@]}" -gt 0 ]]; do

            CURRENT="${READY[0]}"
            READY=("${READY[@]:1}")

            echo "${CURRENT}" >> "${BUILD_ORDER_FILE}"

            echo "${BUILD_NUMBER}. ${CURRENT}"

            BUILD_NUMBER=$((BUILD_NUMBER + 1))

            for DEPENDENT in ${DEPENDENTS[${CURRENT}]:-}; do

              [[ -z "${DEPENDENT}" ]] && continue

              SELECTED_IN_DEGREE["${DEPENDENT}"]=$(
                echo "$(( ${SELECTED_IN_DEGREE[${DEPENDENT}]:-0} - 1 ))"
              )

              if [[ "${SELECTED_IN_DEGREE[${DEPENDENT}]}" -eq 0 ]]; then
                READY+=("${DEPENDENT}")
              fi

            done

            mapfile -t READY < <(
              printf '%s\n' "${READY[@]}" |
              sort
            )

          done

          SELECTED_COUNT="$(wc -l < "${SELECTED_FILE}")"
          BUILD_COUNT="$(wc -l < "${BUILD_ORDER_FILE}")"

          if [[ "${SELECTED_COUNT}" -ne "${BUILD_COUNT}" ]]; then

            echo
            echo "ERROR: Dependency cycle detected or graph is incomplete."
            echo "Selected components : ${SELECTED_COUNT}"
            echo "Build order entries  : ${BUILD_COUNT}"

            exit 1

          fi

          # --------------------------------------------------------
          # Dependency paths
          # --------------------------------------------------------

          : > "${PATHS_FILE}"

          echo "Dependency paths:" >> "${PATHS_FILE}"
          echo >> "${PATHS_FILE}"

          while IFS= read -r ROOT; do

            [[ -z "${ROOT}" ]] && continue

            echo "Changed root: ${ROOT}" >> "${PATHS_FILE}"

            declare -A VISITED
            declare -A PARENT

            QUEUE=("${ROOT}")
            VISITED["${ROOT}"]=1
            Q_INDEX=0

            while [[ "${Q_INDEX}" -lt "${#QUEUE[@]}" ]]; do

              CURRENT="${QUEUE[${Q_INDEX}]}"
              Q_INDEX=$((Q_INDEX + 1))

              for DEPENDENT in ${REVERSE_EDGES[${CURRENT}]:-}; do

                [[ -z "${DEPENDENT}" ]] && continue

                if [[ -z "${SELECTED[${DEPENDENT}]:-}" ]]; then
                  continue
                fi

                if [[ -z "${VISITED[${DEPENDENT}]:-}" ]]; then

                  VISITED["${DEPENDENT}"]=1
                  PARENT["${DEPENDENT}"]="${CURRENT}"

                  QUEUE+=("${DEPENDENT}")

                fi

              done

            done

            for TARGET in "${!VISITED[@]}"; do

              [[ "${TARGET}" == "${ROOT}" ]] && continue

              PATH_ARRAY=()
              CURRENT="${TARGET}"

              while [[ "${CURRENT}" != "${ROOT}" ]]; do

                PATH_ARRAY+=("${CURRENT}")
                CURRENT="${PARENT[${CURRENT}]}"

              done

              PATH_ARRAY+=("${ROOT}")

              REVERSED=()

              for ((i=${#PATH_ARRAY[@]}-1; i>=0; i--)); do
                REVERSED+=("${PATH_ARRAY[i]}")
              done

              (
                IFS=" -> "
                echo "  ${REVERSED[*]}"
              ) >> "${PATHS_FILE}"

            done

            echo >> "${PATHS_FILE}"

          done < "${CHANGED_FILE}"

          echo
          cat "${PATHS_FILE}"

          echo
          echo "Build order:"
          nl -ba "${BUILD_ORDER_FILE}"

      # ------------------------------------------------------------
      # 7. GENERATE REPORTS
      # ------------------------------------------------------------
      - name: Generate build reports
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${WORK_DIR}"
          GRAPH_DIR="${WORK_DIR}/.smart-build"
          REPORT_DIR="${WORK_DIR}/build-artifacts"

          mkdir -p "${REPORT_DIR}"

          echo "============================================================"
          echo "GENERATING BUILD REPORTS"
          echo "============================================================"

          cp "${GRAPH_DIR}/changed-components.txt" \
            "${REPORT_DIR}/changed-components.txt"

          cp "${GRAPH_DIR}/selected-components.txt" \
            "${REPORT_DIR}/selected-components.txt"

          cp "${GRAPH_DIR}/build-order.txt" \
            "${REPORT_DIR}/build-order.txt"

          cp "${GRAPH_DIR}/dependency-paths.txt" \
            "${REPORT_DIR}/dependency-paths.txt"

          cp "${GRAPH_DIR}/graph.tsv" \
            "${REPORT_DIR}/dependency-graph.tsv"

          # --------------------------------------------------------
          # Markdown graph
          # --------------------------------------------------------

          GRAPH_MD="${REPORT_DIR}/osgi-dependency-graph.md"

          cat > "${GRAPH_MD}" <<'EOF'
          # OSGi Dependency Graph

          Graph direction:

          `dependency -> dependent`

          This means the right-hand component depends on the left-hand component.

          ## Dependency Graph

          ```mermaid
          graph LR
          EOF

          while IFS=$'\t' read -r DEPENDENCY DEPENDENT REASON; do

            [[ -z "${DEPENDENCY}" ]] && continue
            [[ -z "${DEPENDENT}" ]] && continue

            echo "    ${DEPENDENCY} --> ${DEPENDENT}" >> "${GRAPH_MD}"

          done < "${GRAPH_DIR}/graph.tsv"

          cat >> "${GRAPH_MD}" <<'EOF'
          ```

          ## Raw Dependency Edges

          | Dependency | Dependent | Reason |
          |---|---|---|
          EOF

          while IFS=$'\t' read -r DEPENDENCY DEPENDENT REASON; do

            [[ -z "${DEPENDENCY}" ]] && continue

            echo "| ${DEPENDENCY} | ${DEPENDENT} | ${REASON} |" \
              >> "${GRAPH_MD}"

          done < "${GRAPH_DIR}/graph.tsv"

          # --------------------------------------------------------
          # Build order report
          # --------------------------------------------------------

          BUILD_ORDER_MD="${REPORT_DIR}/osgi-smart-build-report.md"

          {
            echo "# OSGi Smart Build Report"
            echo
            echo "## Changed Components"
            echo

            if [[ -s "${GRAPH_DIR}/changed-components.txt" ]]; then
              cat "${GRAPH_DIR}/changed-components.txt" |
                sed 's/^/- /'
            else
              echo "- None"
            fi

            echo
            echo "## Selected Components"
            echo

            cat "${GRAPH_DIR}/selected-components.txt" |
              sed 's/^/- /'

            echo
            echo "## Dependency Paths"
            echo

            cat "${GRAPH_DIR}/dependency-paths.txt"

            echo
            echo "## Build Order"
            echo

            nl -ba "${GRAPH_DIR}/build-order.txt"

          } > "${BUILD_ORDER_MD}"

          # --------------------------------------------------------
          # GitHub Job Summary
          # --------------------------------------------------------

          {
            echo "# OSGi Smart Build"
            echo

            echo "## Changed Components"
            echo

            if [[ -s "${GRAPH_DIR}/changed-components.txt" ]]; then
              cat "${GRAPH_DIR}/changed-components.txt" |
                sed 's/^/- /'
            else
              echo "- None"
            fi

            echo
            echo "## Selected Components"
            echo

            cat "${GRAPH_DIR}/selected-components.txt" |
              sed 's/^/- /'

            echo
            echo "## Dependency Paths"
            echo

            cat "${GRAPH_DIR}/dependency-paths.txt"

            echo
            echo "## Build Order"
            echo

            nl -ba "${GRAPH_DIR}/build-order.txt"

            echo
            echo "## Dependency Graph"
            echo

            echo '```text'

            while IFS=$'\t' read -r DEPENDENCY DEPENDENT REASON; do
              [[ -z "${DEPENDENCY}" ]] && continue
              echo "${DEPENDENCY} -> ${DEPENDENT}"
            done < "${GRAPH_DIR}/graph.tsv"

            echo '```'

          } >> "${GITHUB_STEP_SUMMARY}"

          echo
          echo "Reports generated:"
          find "${REPORT_DIR}" -maxdepth 1 -type f -printf '  %f\n'

      # ------------------------------------------------------------
      # 8. BUILD SELECTED COMPONENTS
      # ------------------------------------------------------------
      - name: Build selected OSGi components
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${WORK_DIR}"
          GRAPH_DIR="${WORK_DIR}/.smart-build"

          echo "============================================================"
          echo "BUILDING SELECTED OSGi COMPONENTS"
          echo "============================================================"

          mapfile -t BUILD_ORDER < \
            "${GRAPH_DIR}/build-order.txt"

          TOTAL="${#BUILD_ORDER[@]}"
          INDEX=1

          for COMPONENT in "${BUILD_ORDER[@]}"; do

            echo
            echo "============================================================"
            echo "[${INDEX}/${TOTAL}] BUILDING: ${COMPONENT}"
            echo "============================================================"

            POM="${WORK_DIR}/${COMPONENT}/pom.xml"

            if [[ ! -f "${POM}" ]]; then
              echo "ERROR: POM not found: ${POM}"
              exit 1
            fi

            mvn \
              -B \
              -ntp \
              -f "${POM}" \
              clean install \
              -DskipTests \
              -Dtycho.localArtifacts=default

            echo
            echo "SUCCESS: ${COMPONENT}"

            INDEX=$((INDEX + 1))

          done

          echo
          echo "============================================================"
          echo "OSGi SMART BUILD COMPLETED SUCCESSFULLY"
          echo "============================================================"

      # ------------------------------------------------------------
      # 9. CREATE ARTIFACT MANIFEST
      # ------------------------------------------------------------
      - name: Create artifact manifest
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="${WORK_DIR}"
          REPORT_DIR="${WORK_DIR}/build-artifacts"

          MANIFEST="${REPORT_DIR}/artifact-manifest.md"

          echo "# OSGi Build Artifacts" > "${MANIFEST}"
          echo >> "${MANIFEST}"

          echo "| Component | Artifacts |" >> "${MANIFEST}"
          echo "|---|---|" >> "${MANIFEST}"

          while IFS= read -r COMPONENT; do

            [[ -z "${COMPONENT}" ]] && continue

            TARGET="${WORK_DIR}/${COMPONENT}/target"

            if [[ ! -d "${TARGET}" ]]; then
              echo "| ${COMPONENT} | No target directory |" \
                >> "${MANIFEST}"
              continue
            fi

            ARTIFACTS="$(
              find "${TARGET}" \
                -maxdepth 2 \
                -type f \
                \( -name "*.jar" -o -name "*.zip" \) |
              sort |
              sed "s#^${WORK_DIR}/${COMPONENT}/target/##" |
              tr '\n' '<br>'
            )"

            if [[ -z "${ARTIFACTS}" ]]; then
              ARTIFACTS="No JAR/ZIP artifacts found"
            fi

            echo "| ${COMPONENT} | ${ARTIFACTS} |" \
              >> "${MANIFEST}"

          done < "${WORK_DIR}/.smart-build/build-order.txt"

      # ------------------------------------------------------------
      # 10. UPLOAD REPORTS
      # ------------------------------------------------------------
      - name: Upload smart-build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: northwind-osgi-build-report
          path: |
            osgi-workshop/build-artifacts/**
            osgi-workshop/.smart-build/**
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 11. UPLOAD BUILT ARTIFACTS
      # ------------------------------------------------------------
      - name: Upload OSGi artifacts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: northwind-osgi-artifacts
          path: |
            osgi-workshop/**/target/*.jar
            osgi-workshop/**/target/*.zip
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 12. COMPLETE BUILD PACKAGE
      # ------------------------------------------------------------
      - name: Upload complete build
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: northwind-osgi-complete-build
          path: |
            osgi-workshop/build-artifacts/**
            osgi-workshop/**/target/*.jar
            osgi-workshop/**/target/*.zip
          if-no-files-found: warn